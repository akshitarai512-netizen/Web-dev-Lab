<!DOCTYPE html>
<html>
<head>
   
    <title>P4 - Git Commands Practised</title>
</head>
<body>

    <h1>Git Commands Practised</h1>

    <ol>
        <li>
            <code>git init</code> - Initialize a Git repository.
        </li>
        <li>
            <code>git status</code> - Check repository status.
        </li>
        <li>
            <code>git add .</code> - Stage files.
        </li>
        <li>
            <code>git commit -m "Initial commit"</code> - Save the initial version.
        </li>
        <li>
            <code>git tag v1.0</code> - Create a version tag.
        </li>
        <li>
            <code>git tag</code> - Display available tags.
        </li>
    </ol>

</body>
</html>
